name: Release

# Runs only after the CI workflow completes successfully on master.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and create release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'OpenFolio v__VERSION__'
          releaseBody: 'Asset della release: installer NSIS e eseguibile standalone.'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: '--bundles nsis'

      - name: Upload standalone executable
        if: steps.tauri.outputs.appVersion != ''
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter *.exe -File |
                 Where-Object { $_.DirectoryName -notmatch '\\bundle\\' } |
                 Select-Object -First 1
          if (-not $exe) { Write-Error "Eseguibile non trovato"; exit 1 }
          gh release upload "v${{ steps.tauri.outputs.appVersion }}" $exe.FullName --clobber

      - name: Push installer to store-releases branch
        if: steps.tauri.outputs.appVersion != ''
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.tauri.outputs.appVersion }}"
          $nsisExe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" -File | Select-Object -First 1
          if (-not $nsisExe) {
            $nsisExe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          }
          if (-not $nsisExe) {
            Write-Error "NSIS installer non trovato in bundle/nsis"
            exit 1
          }
          Write-Host "Found installer: $($nsisExe.FullName)"

          git clone --depth 1 --branch store-releases "https://x-access-token:$($env:GITHUB_TOKEN)@github.com/${{ github.repository }}.git" store_repo

          $targetDir = "store_repo/v$version"
          if (-not (Test-Path $targetDir)) {
            New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          }
          Copy-Item -Path $nsisExe.FullName -Destination "$targetDir/$($nsisExe.Name)" -Force

          Push-Location store_repo
          try {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "v$version/$($nsisExe.Name)"
            $status = git status --porcelain
            if ($status) {
              git commit -m "Store binary v$version [skip ci]"
              git push origin store-releases
              Write-Host "Pushed v$version to store-releases successfully!"
            } else {
              Write-Host "Installer for v$version already exists in store-releases."
            }
          } finally {
            Pop-Location
          }

