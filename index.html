<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>OpenFolio</title>
    <style>
      #root {
        height: 100%;
      }
      .sf-pre-splash {
        position: fixed;
        inset: 0;
        background: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .sf-pre-bg {
        position: absolute;
        inset: 0;
        background-image: url('/splash.jpg');
        background-size: cover;
        background-position: center;
      }
      .sf-pre-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, #000000 0%, rgba(0, 0, 0, 0.4) 40%, transparent 75%);
      }
      .sf-pre-title-group {
        position: absolute;
        left: 58px;
        top: 54px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .sf-pre-logo {
        width: 42px;
        height: 42px;
        flex-shrink: 0;
      }
      .sf-pre-title {
        font-size: 44px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.02em;
        color: #ffffff;
        font-family: 'Outfit', sans-serif;
      }
      .sf-pre-version {
        position: absolute;
        left: 58px;
        top: 125px;
        z-index: 10;
        font-family: 'Outfit', sans-serif;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.02em;
        line-height: 1;
        color: #e2e8f0;
      }
      .sf-pre-author {
        position: absolute;
        left: 58px;
        bottom: 60px;
        z-index: 10;
        font-family: 'Outfit', sans-serif;
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 0.03em;
        color: #cbd5e1;
      }
      .sf-pre-author strong {
        font-weight: 700;
        color: #ffffff;
      }
    </style>
  </head>
  <body style="margin: 0; background: #000000;">
    <div id="root">
      <div class="sf-pre-splash">
        <div class="sf-pre-bg"></div>
        <div class="sf-pre-overlay"></div>
        <div class="sf-pre-title-group">
          <img src="/favicon.svg" alt="OpenFolio" class="sf-pre-logo" />
          <div class="sf-pre-title">Open<span style="color: #f59e0b;">Folio</span></div>
        </div>
        <div class="sf-pre-version">-v %APP_VERSION%</div>
        <div class="sf-pre-author">Francesco <strong>Flora</strong></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
