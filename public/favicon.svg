<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Radiant Amber Gradient -->
    <linearGradient id="fav_amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="22%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Platinum Left Wing -->
    <linearGradient id="fav_platinum" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Subtle Premium Shadow -->
    <filter id="fav_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- OPENFOLIO FULL-BLEED FAVICON -->
  <g filter="url(#fav_shadow)">
    <!-- LEFT FOLIO WING (Platinum / Studio Slate) -->
    <path d="M 252 20 
             C 200 95, 110 180, 44 250 
             C 22 274, 24 316, 52 350 
             L 178 468 
             C 202 488, 230 494, 252 494 Z"
          fill="url(#fav_platinum)" />

    <!-- RIGHT FOLIO WING (Luminous Amber Flame Gold) -->
    <path d="M 260 20 
             C 312 95, 402 180, 468 250 
             C 490 274, 488 316, 460 350 
             L 334 468 
             C 310 488, 282 494, 260 494 Z"
          fill="url(#fav_amber)" />

    <!-- Center Spine Slit (Upper) -->
    <line x1="256" y1="20" x2="256" y2="252" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />

    <!-- Breather Eyelet / Golden Star Spark -->
    <circle cx="256" cy="265" r="22" fill="#0f172a" />
    <circle cx="256" cy="265" r="11" fill="#fef08a" />

    <!-- Lower Spine Fold Line -->
    <line x1="256" y1="288" x2="256" y2="492" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />

    <!-- Subtle Minimalist Facet Inlays -->
    <path d="M 252 90 L 98 256 C 130 310, 180 370, 252 420 Z" fill="#ffffff" opacity="0.3" />
    <path d="M 260 90 L 414 256 C 382 310, 332 370, 260 420 Z" fill="#fef08a" opacity="0.4" />
  </g>
</svg>
